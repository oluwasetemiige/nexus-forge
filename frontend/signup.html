<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign up page Nexus Forge</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
      <div class="container nav-inner">
        <a href="index.html" class="logo">
          <span class="logo-mark"></span> Nexus Forge
        </a>
        <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">☰</button>
        <div class="nav-links" id="navLinks">
          <a href="index.html" class="active">Home</a>
          <a href="browse.html" class="">Browse Gigs</a>
        </div>
        <div class="nav-actions">
          <a href="login.html" class="btn btn-ghost btn-sm">Log in</a>
                 <a href="signup.html" class="btn btn-primary btn-sm">Sign up</a>
        </div>
      </div>
    </nav>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="card">
      <div class="text-center mb-24">
        <div class="logo" style="justify-content:center;"><span class="logo-mark">Nexus Forge</span></div>   </div>

      <form id="signupForm">
        <div class="form-group">
          <label class="form-label">Join as</label>
          <div class="role-pick">
            <div class="role-option selected" data-role="freelancer">
              <strong>Client</strong>
              <div class="muted" style="font-size:0.78rem;">Search work & hire talent</div>
            </div>
            <div class="role-option" data-role="client">
              <strong>Freelancer</strong>
              <div class="muted" style="font-size:0.78rem;">Create gigs & get paid</div>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="name">Full name</label>
          <input class="form-control" id="name" type="text" placeholder="Ada Lovelace" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input class="form-control" id="email" type="email" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input class="form-control" id="password" type="password" placeholder="At least 6 characters" required>
        </div>

        <div class="form-group">
          <div class="checkbox-row">
            <input type="checkbox" id="isStudent">
            <label for="isStudent" style="font-size:0.9rem;" >I'm a student (get a Student Verified badge)</label>
          </div>
        </div>

        <div id="signupError"></div>

        <button type="submit" class="btn btn-primary btn-block" id="signupBtn">Create account</button>
      </form>

      <p class="text-center mt-24 muted" style="font-size:0.88rem;">
        Already have an account? <a href="login.html" style="color:var(--orange-400); font-weight:600;">Log in</a>
      </p>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script>
renderNav();

let selectedRole = "freelancer";
document.querySelectorAll(".role-option").forEach((el) => {
  el.addEventListener("click", () => {
    document.querySelectorAll(".role-option").forEach((o) => o.classList.remove("selected"));
    el.classList.add("selected");
    selectedRole = el.dataset.role;
  });
});

document.getElementById("signupForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("signupBtn");
  const errorBox = document.getElementById("signupError");
  errorBox.innerHTML = "";

  const payload = {
    name: document.getElementById("name").value.trim(),
    email: document.getElementById("email").value.trim(),
    password: document.getElementById("password").value,
    role: selectedRole,
    is_student: document.getElementById("isStudent").checked,
  };

  btn.disabled = true;
  btn.textContent = "Creating account...";

  try {
    const data = await Api.register(payload);
    Auth.setToken(data.token);
    Auth.setUser(data.user);
    showToast(`Welcome to Nexus Forge, ${data.user.name.split(" ")[0]}!`);
    window.location.href = "dashboard.html";
  } catch (err) {
    errorBox.innerHTML = `<p style="color:var(--danger); font-size:0.85rem; margin-bottom:12px;">${escapeHtml(err.message)}</p>`;
    btn.disabled = false;
    btn.textContent = "Create account";
  }
});
</script>
</body>
</html>
