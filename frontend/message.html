<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Messages | Nexus Forge</title>

    <link rel="stylesheet" href="css/style.css">

    
</head>

<body>

    <div class="messages-page">

        <!-- Conversation List -->
        <aside class="conversation-panel">

            <div class="conversation-header">
                <h2>Messages</h2>
            </div>
                
            <div id="conversationList">

                <div class="conversation active"
                     onclick="openConversation('David')">

                    <div class="avatar">D</div>

                    <div class="conversation-info">
                        <div class="conversation-name">David</div>
                        <div class="last-message">
                            Hey, I can start tomorrow.
                        </div>
                    </div>

                </div>

                <div class="conversation"
                     onclick="openConversation('Sarah')">

                    <div class="avatar">S</div>

                    <div class="conversation-info">
                        <div class="conversation-name">Sarah</div>
                        <div class="last-message">
                            Thanks for the opportunity!
                        </div>
                    </div>

                </div>

            </div>

        </aside>


        <!-- Chat -->
        <main class="chat-panel">

            <header class="chat-header">

                <div class="chat-user">

                    <div class="avatar" id="chatAvatar">
                        D
                    </div>

                    <div>
                        <strong id="chatName">
                            David
                        </strong>

                        <div class="online">
                            ● Online
                        </div>
                    </div>

                </div>

            </header>


            <!-- Messages -->
            <section class="messages" id="messages">

                <div class="message received">
                    Hey! I can start working on the project tomorrow.
                    <span class="message-time">
                        10:32 AM
                    </span>
                </div>

                <div class="message sent">
                    Perfect. I'll send you the project details.
                    <span class="message-time">
                        10:35 AM
                    </span>
                </div>

                <div class="message received">
                    Sounds good 👍
                    <span class="message-time">
                        10:36 AM
                    </span>
                </div>

            </section>


            <!-- Input -->
            <form class="message-input-area"
                  id="messageForm">

                <input
                    type="text"
                    id="messageInput"
                    class="message-input"
                    placeholder="Type a message..."
                    autocomplete="off"
                >

                <button
                    type="submit"
                    class="send-button">
                    ➤
                </button>

            </form>

        </main>

    </div>


    <script>

        const params = new
        URLSearchParams(window.location.search);
        const userId = params.get("user_id");
        const recieverId = params.get("user_id");
        const gigId = params.get("gig_id");

         
        if(!userId){
            alert("No user Selected.");
        }


        const messageForm =
            document.getElementById("messageForm");

        const messageInput =
            document.getElementById("messageInput");

        const messages =
            document.getElementById("messages");


        messageForm.addEventListener("submit", async function(event) {

            event.preventDefault();

            const text =
                messageInput.value.trim();

            if (!text) return;
            try{
                await Api.sendmessage({
                    gigId: Number(gigId),
                    reciever_id: Number(userId),
                    content: text
                });
                messageInput.value = "";
                await loadMessages();
            }catch(error){
                alert(error.message);  
            }


            const message =
                document.createElement("div");

            message.className = "message sent";

            message.innerHTML = `
                ${escapeHtml(text)}
                <span class="message-time">
                    Just now
                </span>
            `;

            messages.appendChild(message);

            messageInput.value = "";

            messages.scrollTop =
                messages.scrollHeight;

        });


        function openConversation(name) {

            document.getElementById("chatName")
                .textContent = name;

            document.getElementById("chatAvatar")
                .textContent = name.charAt(0);

            document.querySelectorAll(".conversation")
                .forEach(item => {
                    item.classList.remove("active");
                });

            event.currentTarget.classList.add("active");

        }


        function escapeHtml(text) {

            const div = document.createElement("div");

            div.textContent = text;

            return div.innerHTML;
        }

        async function sendmessage()
        {
            const message = messageInput.value.trim();

            if(!message )return;

            const response = await fetch("api/messages",{
                method: "POST",
                headers:{
                    "Content- Type": "application/json"
                },
                credentials:"include",
                body: JSON.stringify({
                    reciever_id: reciever_id,
                    gig_id: gigId,
                    message: message
                })
            });


            const data = await response.json();
            if(!response.ok){
                alert(date.error||"could not send message");
                return;
            }
            messageInput.value = "";
            loadMessages();
        }

        async function loadMessages()
        {
            const response = await fetch(
                `/api/messages/${gigId}/${recieverId}`,
                {
                    credentials: "include"
                }

            );
            try{
                const data = await Api.getMessages(
                
                    Number(gigId),
                    Number(userId)
                );
                messages.innerHTML = "";
                data.messages.forEach(message =>{
                    const div = document.createElement("div");
                    const currentUser = Auth.getUser();
                    div.className = message.sender_id === currentUser.id ?"message sent":"message Recieved";
                    div.innerHTML = `${escapeHtml(message.content)}
                    <span class = "message-time">${new Date(message.created_at).toLocaleTimeString([],{
                        hour: "2-digit",
                        minute: "2-digit"
                    })}
                    </span>
                     `;
                     message.appendChild(div);
                });
                messages.scrollTop = messages.scrollHeight;
                
               
            } catch(error){
                console.error("could not load message")
            }
            loadMessages();
        }

    </script>

</body>
</html>
