<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Messages | Nexus Forge</title>

    <link rel="stylesheet" href="css/style.css">

    
</head>

<body>

    <div class="messages-page">

        <!-- Conversation List -->
        <aside class="conversation-panel">

            <div class="conversation-header">
                <h2>Messages</h2>
            </div>
                
            <div id="conversationList">

                <div class="conversation active"
                     onclick="openConversation('David')">

                    <div class="avatar">D</div>

                    <div class="conversation-info">
                        <div class="conversation-name">David</div>
                        <div class="last-message">
                            Hey, I can start tomorrow.
                        </div>
                    </div>

                </div>

                <div class="conversation"
                     onclick="openConversation('Sarah')">

                    <div class="avatar">S</div>

                    <div class="conversation-info">
                        <div class="conversation-name">Sarah</div>
                        <div class="last-message">
                            Thanks for the opportunity!
                        </div>
                    </div>

                </div>

            </div>

        </aside>


        <!-- Chat -->
        <main class="chat-panel">

            <header class="chat-header">

                <div class="chat-user">

                    <div class="avatar" id="chatAvatar">
                        D
                    </div>

                    <div>
                        <strong id="chatName">
                            David
                        </strong>

                        <div class="online">
                            ● Online
                        </div>
                    </div>

                </div>

            </header>


            <!-- Messages -->
            <section class="messages" id="messages">

                <div class="message received">
                    Hey! I can start working on the project tomorrow.
                    <span class="message-time">
                        10:32 AM
                    </span>
                </div>

                <div class="message sent">
                    Perfect. I'll send you the project details.
                    <span class="message-time">
                        10:35 AM
                    </span>
                </div>

                <div class="message received">
                    Sounds good 👍
                    <span class="message-time">
                        10:36 AM
                    </span>
                </div>

            </section>


            <!-- Input -->
            <form class="message-input-area"
                  id="messageForm">

                <input
                    type="text"
                    id="messageInput"
                    class="message-input"
                    placeholder="Type a message..."
                    autocomplete="off"
                >

                <button
                    type="submit"
                    class="send-button">
                    ➤
                </button>

            </form>

        </main>

    </div>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script>

const params = new URLSearchParams(window.location.search);

const gigId = params.get("gig_id");
const userId = params.get("user_id");

const messageForm = document.getElementById("messageForm");
const messageInput = document.getElementById("messageInput");
const messages = document.getElementById("messages");

const currentUser = Auth.getUser();


// Make sure we have the required information
if (!gigId || !userId) {

    alert("No conversation selected.");

}


// Load messages
async function loadMessages() {

    if (!gigId || !userId) return;

    try {

        const data = await Api.getMessages(
            Number(gigId),
            Number(userId)
        );

        messages.innerHTML = "";

        data.messages.forEach(message => {

            const div = document.createElement("div");

            div.className =
                message.sender_id === currentUser.id
                    ? "message sent"
                    : "message received";

            div.innerHTML = `
                ${escapeHtml(message.content)}

                <span class="message-time">
                    ${new Date(
                        message.created_at + "Z"
                    ).toLocaleTimeString([], {
                        hour: "2-digit",
                        minute: "2-digit"
                    })}
                </span>
            `;

            messages.appendChild(div);

        });

        messages.scrollTop = messages.scrollHeight;

    } catch (error) {

        console.error("Could not load messages:", error);

        showToast(error.message, "error");

    }

}


// Send message
messageForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    const text = messageInput.value.trim();

    if (!text) return;

    if (!gigId || !userId) {

        showToast("No conversation selected.", "error");

        return;

    }

    try {

        await Api.sendMessage({

            gig_id: Number(gigId),

            receiver_id: Number(userId),

            content: text

        });

        messageInput.value = "";

        await loadMessages();

    } catch (error) {

        showToast(error.message, "error");

    }

});


// Escape HTML
function escapeHtml(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


// Load messages when page opens
loadMessages();

</script>

</body>
</html>
